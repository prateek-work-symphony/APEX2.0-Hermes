schedules:
- cron: "30 10 * * *" 
  displayName: Daily Automated ADO Project Technical Audit
  always: true
  branches:
    include:
    - main

trigger: none

pool:
  vmImage: 'ubuntu-latest' 

steps:
- script: |
    echo "🐳 Pulling latest Hermes Agent image..."
    docker pull prateekmeherk/hermes-ado-agent:v26
    
    echo "🚀 Executing Agent Sandbox..."
    docker run --rm \
      -e MOCK_PAT="$(MOCK_PAT)" \
      -e COMPANY_PAT="$(COMPANY_PAT)" \
      -e AZURE_FOUNDRY_API_KEY="$(AZURE_FOUNDRY_API_KEY)" \
      -e MOCK_ORG="$(MOCK_ORG)" \
      -e MOCK_PROJECT="$(MOCK_PROJECT)" \
      -e COMPANY_ORG="$(COMPANY_ORG)" \
      -e COMPANY_PROJECT="$(COMPANY_PROJECT)" \
      -e CI="true" \
      prateekmeherk/hermes-ado-agent:v26
      
  displayName: 'Execute Embedded Hermes Delivery Agent'