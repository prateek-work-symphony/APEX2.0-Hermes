schedules:
- cron: "0 8 * * *" # Fires automatically every single day at 8:00 AM UTC
  displayName: Daily Automated ADO Project Technical Audit
  always: true

trigger: none

pool:
  vmImage: 'ubuntu-latest' 

container:
  image: prateekmeherk/hermes-ado-agent:latest 
  env:
    AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
    MOCK_ORG: $(MOCK_ORG)
    MOCK_PROJECT: $(MOCK_PROJECT)

steps:
- script: /app/run_sweep.sh
  displayName: 'Execute Embedded Hermes Delivery Agent'